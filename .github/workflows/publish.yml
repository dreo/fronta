name: publish

# Release flow: bump `project.version`, add the CHANGELOG section, merge to `main`, then push the
# tag `vX.Y.Z`. This workflow runs the full gate on the tagged commit, builds, publishes to PyPI
# through trusted publishing (no API token; pypi.org must list this repository, `publish.yml` and
# the `pypi` environment as a trusted publisher of `fronta`), and creates the GitHub release with
# the CHANGELOG section as notes and the wheel and sdist attached.
on:
  push:
    tags: ["v*"]

jobs:
  gate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fronta
          POSTGRES_PASSWORD: fronta
          POSTGRES_DB: fronta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fronta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FRONTA_TEST_DSN: postgresql://fronta:fronta@127.0.0.1:5432/fronta
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11.18"
      - name: The tag must be the project version, on main, with a CHANGELOG section
        run: |
          version="$(uv version --short)"
          test "v${version}" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v${version}"; exit 1; }
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main || { echo "tag ${GITHUB_REF_NAME} is not on main"; exit 1; }
          version_re="${version//./\\.}"
          grep -qE "^## \[?${version_re}\]?( |$)" CHANGELOG.md || { echo "CHANGELOG.md has no section for ${version}"; exit 1; }
      - run: sudo apt-get update && sudo apt-get install -y bubblewrap util-linux
      - run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - run: uv lock --check
      - run: uv sync --all-extras --locked
      - run: uv run playwright install --with-deps chromium
      - run: make checkall
      - run: uv build --no-sources
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7
        with:
          name: dist
          path: dist/
  publish:
    needs: gate
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write   # trusted publishing, no API token in secrets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7
        with:
          version: "0.11.18"
      - run: uv publish --trusted-publishing always

  release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8
        with:
          name: dist
          path: dist/
      - name: GitHub release with the CHANGELOG section as notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          python3 - "$version" > notes.md <<'PY'
          import re, sys
          version = sys.argv[1]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## \[?{re.escape(version)}\]?[^\n]*\n(.*?)(?=^## |\Z)", text, re.S | re.M)
          print(match.group(1).strip() if match else f"Release {version}")
          PY
          case "$version" in *a*|*b*|*rc*) pre=--prerelease ;; *) pre= ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md $pre
